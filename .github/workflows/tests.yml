# The net only helps if it runs somewhere other than the machine that wrote it.
#
# `make test-clone` is the suite as a fresh clone sees it: the DNGs of `Samples/` are
# git-ignored, so every test that needs a real RAW file skips itself rather than failing.
# That is exactly what a runner has.
#
# The package targets macOS 15 and builds with Swift 6, but it needs a *recent* Xcode to
# build at all: which types Apple has marked `Sendable` changes between SDKs, and an older one
# rejects code the newer one accepts. The runner therefore tracks the toolchain rather than the
# deployment target. Should one ever be too old, the failure to read is "cannot find type" or
# "non-Sendable type" in a framework, not a test: move `runs-on` forward rather than loosening
# the code.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The newest Xcode on the image, not whatever it defaults to. The default has been a
      # release behind, and a release behind was enough to crash the compiler on this package
      # while emitting a module — a compiler bug, but ours to work around.
      - name: Take the newest Xcode on the image
        run: |
          newest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Found: $(ls -d /Applications/Xcode*.app 2>/dev/null | tr '\n' ' ')"
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest"; fi

      - name: Show the toolchain
        run: swift --version && xcodebuild -version

      # Everything that renders runs under the memory guard, here as everywhere else: a
      # mistake in a Core Image graph can ask for hundreds of gigabytes.
      - name: Build
        run: make build

      - name: Test as a fresh clone
        run: make test-clone
